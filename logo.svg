<!--
Protoplanetary Disk Logo
Author: Joshua Sendgikoski
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
width="100" height="100">

    <!-- Cosmic Background Container-->
    <rect width="100" height="100" rx="20" fill="#0B0F19" />

        <!-- Central Protostar -->
        <circle cx="50" cy="50" r="10" fill="#FFF" />
        <circle cx="50" cy="50" r="10" fill="#FFB703" opacity="0.4"/>

        <!-- Inner Accretion Disk -->
        <circle cx="50" cy="50" r="26" fill="none"
        stroke="#FF6A00" stroke-width="5" 
        stroke-dasharray="130 30" stroke-linecap="round"/>

        <!-- Outer Ring -->
        <circle cx="50" cy="50" r="40" fill="none"
        stroke="#92270a" stroke-width="4" 
        stroke-dasharray="90 40 70 30" stroke-linecap="round"/>

        <!-- Protoplanet -->
        <circle cx="69.6" cy="67" r="3" fill="#8ECAE6"/>

</svg> 